  - { first: Dave, last: Miller, username: dmiller, password: "Welcome2026!", department: IT, groups: [Server-Operators] }
  - { first: Sarah, last: Connor, username: sconnor, password: "Welcome2026!", department: Finance }
  - { first: Mike, last: Chen, username: mchen, password: "Password123!", department: HR }
