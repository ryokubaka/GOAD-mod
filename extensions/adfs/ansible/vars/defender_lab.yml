defender_kerberoastable_accounts:
  - { name: svc_backup, spn: "backup/dc01.sevenkingdoms.local", password: "SvcBackup2026!" }
  - { name: svc_sql, spn: "MSSQLSvc/dc01.sevenkingdoms.local:1433", password: "SqlService2026!" }

defender_asrep_roastable_accounts:
  - { name: svc_legacy, password: "Legacy2026!" }

defender_high_value_accounts:
