---
es_package_url: "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch"
reserved_xpack_users: ["elastic","kibana","logstash_system"]
sysd_config_file: "/etc/systemd/system/elasticsearch.service.d/override.conf"

fleet_port: 9200
es_version: "9.4.1"
elasticsearch_version: "9.4.1"
elastic_agent_version: "9.4.1"
# Elastic Defend EPM package version (often 9.4.0 while stack/agent is 9.4.1 — see fleet-resolve-endpoint-version.yml).
elastic_defend_version: "9.4.0"
# Fleet Server integration package (1.x on EPR; do not use stack version like endpoint 9.4.x).
elastic_fleet_server_package_version: "1.6.1"
es_xpack_trial: true
es_api_basic_auth_username: elastic
es_api_basic_auth_password: MeowMeow123