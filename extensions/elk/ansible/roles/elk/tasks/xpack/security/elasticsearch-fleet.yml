---
# Fleet Server + Elastic Defend: Kibana preconfig supplies fleet-server-policy (fleet_server integration only).
# Endpoint is added via API after Fleet Server is running (Elastic does not support Endpoint in kibana.yml preconfig).
- name: Ensure jq is installed
  apt:
    name: jq
    state: present

- name: Check for cluster health; wait 120 seconds for health status
  shell: |
    curl -sS -XGET -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:9200/_cluster/health?wait_for_status=yellow&timeout=120s' -H 'kbn-xsrf: true'

- name: Wait for Kibana port
  wait_for:
    host: "{{ fleet_server }}"
    port: 5601
    delay: 5
    timeout: 600
    state: started

- name: Wait for Kibana HTTP API
  uri:
    url: "http://{{ fleet_server }}:5601/api/status"
    method: GET
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    status_code: [200]
  register: kibana_api_wait
  until: kibana_api_wait.status == 200
  retries: 60
  delay: 5

- name: Patch Kibana fleet_server package version when config is stale or wrong
  ansible.builtin.include_tasks: fleet-patch-kibana-fleet-server-version.yml

- name: Wait for Fleet Server agent policy object (preconfig shell may have empty package_policies)
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/agent_policies/fleet-server-policy"
    method: GET
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: fleet_server_policy_wait
  until: >
    fleet_server_policy_wait.status == 200
    and fleet_server_policy_wait.json.item.id | default('') == 'fleet-server-policy'
  retries: 36
  delay: 10

- name: Ensure Fleet Server integration exists on fleet-server-policy
  ansible.builtin.include_tasks: fleet-ensure-fleet-server-integration.yml

- name: List Fleet Server hosts
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/fleet_server_hosts"
    method: GET
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    status_code: [200]
  register: fleet_server_hosts_list

- name: Add fleet server host URL when not already present
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/fleet_server_hosts"
    method: POST
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: fleet-server-host
      host_urls: ["https://{{ fleet_server }}:8220"]
      is_default: true
    status_code: [200]
  when: (fleet_server_hosts_list.json['items'] | default([]) | length) == 0

- name: Fix Fleet Server host URLs still using http on port 8220
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/fleet_server_hosts/{{ item.id }}"
    method: PUT
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ item.name }}"
      host_urls: ["https://{{ fleet_server }}:8220"]
      is_default: "{{ item.is_default | default(false) }}"
      is_internal: "{{ item.is_internal | default(false) }}"
    status_code: [200]
  loop: "{{ fleet_server_hosts_list.json['items'] | default([]) }}"
  when: "'http://' in (item.host_urls | default([]) | join(' '))"

- name: Create Fleet Server service token
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/service_tokens"
    method: POST
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    headers:
      Content-Type: "application/json"
      kbn-xsrf: "true"
    body_format: json
    body: {}
    status_code: [200]
  register: fleet_enrollment_token

- name: Set Fleet Server service token string
  set_fact:
    fleet_server_service_token: "{{ fleet_enrollment_token.json.item.value | default(fleet_enrollment_token.json.value, true) }}"

- name: Assert Fleet Server service token was returned
  assert:
    that:
      - fleet_server_service_token is defined
      - fleet_server_service_token | length > 10
    fail_msg: "Fleet service token missing from Kibana response; check /api/fleet/service_tokens and credentials."

- name: Ensure installation directory exists
  file:
    path: "{{ install_dir }}"
    state: directory
    mode: '0755'

- name: Check if elastic agent is already downloaded
  stat:
    path: "/tmp/{{ elastic_agent_tar }}"
  register: agenttar_stat

- name: Download Elastic Agent
  get_url:
    url: "{{ elastic_agent_url }}"
    dest: "/tmp/{{ elastic_agent_tar }}"
    mode: '0644'
  when: not agenttar_stat.stat.exists

- name: Extract Elastic Agent
  unarchive:
    src: "/tmp/{{ elastic_agent_tar }}"
    dest: "{{ install_dir }}"
    remote_src: yes

- name: Check if Agent already installed
  stat:
    path: "/usr/bin/elastic-agent"
  register: agentinstall_stat

- name: Uninstall Elastic Agent
  shell: "echo 'Y' | sudo /usr/bin/elastic-agent uninstall"
  when: agentinstall_stat.stat.exists
  register: uninstall_stat
  failed_when: false

- name: Stat Elastic Agent after uninstall attempt
  stat:
    path: "/usr/bin/elastic-agent"
  register: agent_after_uninstall

- name: Reboot ELK server before elastic agent installation
  ansible.builtin.reboot:
    msg: "Rebooting ELK server before elastic agent installation"
  when: elastic_agent_reboot_before_install | bool

- name: Wait for Elasticsearch after reboot
  wait_for:
    host: "{{ fleet_server }}"
    port: 9200
    delay: 5
    timeout: 600
    state: started
  when: elastic_agent_reboot_before_install | bool

- name: Wait for Kibana port after reboot
  wait_for:
    host: "{{ fleet_server }}"
    port: 5601
    delay: 5
    timeout: 600
    state: started
  when: elastic_agent_reboot_before_install | bool

- name: Wait for Fleet policy object after reboot
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/agent_policies/fleet-server-policy"
    method: GET
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: fleet_server_policy_wait2
  until: >
    fleet_server_policy_wait2.status == 200
    and fleet_server_policy_wait2.json.item.id | default('') == 'fleet-server-policy'
  retries: 36
  delay: 10
  when: elastic_agent_reboot_before_install | bool

- name: Ensure Fleet Server integration after reboot
  ansible.builtin.include_tasks: fleet-ensure-fleet-server-integration.yml
  when: elastic_agent_reboot_before_install | bool

- name: Check for cluster health; wait 120 seconds for health status
  shell: |
    curl -sS -XGET -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:9200/_cluster/health?wait_for_status=yellow&timeout=120s' -H 'kbn-xsrf: true'

- name: Install Elastic Agent as Fleet Server
  shell: >-
    echo 'Y' | sudo {{ install_dir }}/elastic-agent-{{ elastic_agent_version }}-linux-x86_64/elastic-agent install
    --fleet-server-es=http://{{ fleet_server }}:{{ fleet_port }}
    --fleet-server-service-token={{ fleet_server_service_token }}
    --fleet-server-policy=fleet-server-policy
    --fleet-server-port=8220
    --fleet-server-host={{ elastic_fleet_server_bind_host }}
    --install-servers{% if elastic_fleet_server_es_insecure | bool %} --fleet-server-es-insecure{% endif %}{% if elastic_agent_install_insecure | bool %} --insecure{% endif %} -f
  when: not agent_after_uninstall.stat.exists
  register: elastic_agent_install_result

- name: Stat Elastic Agent after install
  stat:
    path: "/usr/bin/elastic-agent"
  register: agent_installed_check

- name: Assert Elastic Agent installed
  assert:
    that:
      - agent_installed_check.stat.exists
    fail_msg: "elastic-agent install failed or was skipped; check elastic_agent_install_result and Fleet policy/token."

- name: Ensure Windows integration (Sysmon Operational) on agent-policy
  ansible.builtin.include_tasks: fleet-ensure-windows-sysmon.yml

- name: Find existing policies
  shell: |
    curl -XGET -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:5601/api/fleet/package_policies' -H 'Content-Type: application/json' \
     -H 'kbn-xsrf: true'
  register: package_policies

- name: Set fact for policies
  set_fact:
    policy_list_1: "{{ package_policies.stdout | from_json }}"

- name: Delete endpoint package policy if it already exists
  block:
    - name: Find package policy ID for endpoint (by package name)
      set_fact:
        endpoint_policy_id: "{{ policy_list_1 | json_query(\"items[?package.name=='endpoint'].id | [0]\") | default('', true) }}"

    - name: Delete endpoint package policy
      uri:
        url: "http://{{ fleet_server }}:5601/api/fleet/package_policies/delete"
        method: POST
        user: "{{ es_api_basic_auth_username }}"
        password: "{{ es_api_basic_auth_password }}"
        force_basic_auth: true
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        body_format: json
        body:
          packagePolicyIds: ["{{ endpoint_policy_id }}"]
          force: true
        status_code: [200]
      when: endpoint_policy_id | default('') | length > 0
  when: (policy_list_1 | json_query("items[?package.name=='endpoint']") | default([], true) | length) > 0

# - name: Install windows package policy
#   shell: |
#     curl -XPOST -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
#     'http://{{ fleet_server }}:5601/api/fleet/package_policies' -H 'Content-Type: application/json' \
#     -H 'kbn-xsrf: true' -d '{{ lookup("template", "windows_initial.json") | to_nice_json }}'
#   register: windows_install

- name: Resolve Elastic Defend package version for Fleet API
  ansible.builtin.include_tasks: fleet-resolve-endpoint-version.yml

- name: Install endpoint package policy (Elastic Defend on agent-policy)
  vars:
    _endpoint_install_body: "{{ lookup('template', 'endpoint_initial.json') }}"
  uri:
    url: "http://{{ fleet_server }}:5601/api/fleet/package_policies"
    method: POST
    user: "{{ es_api_basic_auth_username }}"
    password: "{{ es_api_basic_auth_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body: "{{ (_endpoint_install_body | from_json) if (_endpoint_install_body is string) else _endpoint_install_body }}"
    status_code: [200]
  register: endpoint_install

- name: Set fact for endpoint package policy
  set_fact:
    endpoint_package: "{{ endpoint_install.json }}"
  when: endpoint_install is succeeded

- name: Create modified endpoint package
  copy:
    content: "{{ endpoint_package | json_query('item') | to_nice_json }}"
    dest: /tmp/endpoint_integration.json
    force: true
  when: endpoint_package

- name: Fix mode lines in integration file
  replace:
    path: /tmp/endpoint_integration.json
    regexp: '"mode": "off"'
    replace: '"mode": "detect"'

- name: Fix enabled lines in integration file
  replace:
    path: /tmp/endpoint_integration.json
    regexp: '"enabled": false'
    replace: '"enabled": true'

- name: Fix blocklist lines in integration file
  replace:
    path: /tmp/endpoint_integration.json
    regexp: '"blocklist": false'
    replace: '"blocklist": true'

- name: Fix usb lines in integration file
  replace:
    path: /tmp/endpoint_integration.json
    regexp: '"usb_storage": "audit"'
    replace: '"usb_storage": "deny_all"'

- name: Remove bad lines
  lineinfile:
    path: /tmp/endpoint_integration.json
    regexp: "{{ item }}"
    state: absent
  loop:
    - "\"id\""
    - "revision"
    - "created_at"
    - "created_by"
    - "updated_at"
    - "updated_by"

- name: Read new modified integration file
  slurp:
    src: /tmp/endpoint_integration.json
  register: endpoint_integration

- name: Find existing policies again (now with Elastic Defend installed)
  shell: |
    curl -XGET -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:5601/api/fleet/package_policies' -H 'Content-Type: application/json' \
    -H 'kbn-xsrf: true'
  register: package_policies

- name: Set fact for policies (part 2)
  set_fact:
    policy_list_2: "{{ package_policies.stdout | from_json }}"

- name: Find package policy ID for endpoint
  set_fact:
    endpoint_policy_id: "{{ policy_list_2 | json_query(\"items[?package.name=='endpoint'].id | [0]\") | default('', true) }}"

- name: Update endpoint package policy to enable rules
  shell: |
    curl -fsS -XPUT -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:5601/api/fleet/package_policies/{{ endpoint_policy_id }}' -H 'Content-Type: application/json' \
    -H 'kbn-xsrf: true' -d '{{ endpoint_integration["content"] | b64decode | to_nice_json }}'
  register: endpoint_put_result
  when: endpoint_policy_id | default('') | length > 0

- name: Check for cluster health; wait 120 seconds for health status
  shell: |
    curl -XGET -u {{ es_api_basic_auth_username }}:{{ es_api_basic_auth_password }} \
    'http://{{ fleet_server }}:9200/_cluster/health?wait_for_status=yellow&timeout=120s' -H 'kbn-xsrf: true'
- name: Block for Detection Rule enablement
  block:
    - name: Install all prepackaged detection rules (note - takes a while to complete)
      uri:
        url: "http://{{ fleet_server }}:5601/api/detection_engine/rules/prepackaged"
        method: PUT
        user: "{{ es_api_basic_auth_username }}"
        password: "{{ es_api_basic_auth_password }}"
        headers:
          kbn-xsrf: "true"
        force_basic_auth: yes
#      no_log: true
      ignore_errors: true # sometimes it gives a 500 even though it's successful

    - name: Pause for 2 minutes to give time for all rules to be installed because ELK is a pain
      ansible.builtin.pause:
        minutes: 2

    - name: Query the API for all detection rules
      uri:
        url: "http://{{ fleet_server }}:5601/api/detection_engine/rules/_find?per_page={{ page_size }}&page={{ current_page }}&filter=alert.attributes.enabled:false"
        method: GET
        user: "{{ es_api_basic_auth_username }}"
        password: "{{ es_api_basic_auth_password }}"
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        force_basic_auth: yes
        return_content: yes
      register: query_result
      no_log: true

    - name: Calculate number of pages and total disabled rules
      set_fact:
        loop_rule_page: "{{ query_result.json | json_query('perPage') | int }}"
        loop_rule_total: "{{ query_result.json | json_query('total') | int }}"

    - name: Calculate number of times to loop
      set_fact:
        loop_rule_count: "{{ ((loop_rule_total | int) / (loop_rule_page | int)) | round(0, 'ceil') | int }}"

    - name: Initialize an empty list to store rule IDs
      set_fact:
        rule_ids: []

    - name: Loop through pages and collect rule IDs
      include_tasks: xpack/security/kibana-rules.yml
      loop: "{{ range(1, (loop_rule_count | int + 1)) }}"

    - name: Create chunks of rules in batches of 100 (Elastic limit for bulk API action)
      set_fact:
        rule_ids_chunked: "{{ rule_ids | batch(100) }}"
      no_log: true

    - name: Enable rules in chunks of 100 (Elastic limit for bulk API action)
      uri:
        url: "http://{{ fleet_server }}:5601/api/detection_engine/rules/_bulk_action"
        method: POST
        user: "{{ es_api_basic_auth_username }}"
        password: "{{ es_api_basic_auth_password }}"
        headers:
          kbn-xsrf: "true"
          Content-Type: "application/json"
        body: |
          {
            "ids": {{ item }},
            "action": "enable"
          }
        body_format: json
        force_basic_auth: yes
        status_code: 200
      loop: "{{ rule_ids_chunked }}"
      no_log: true

