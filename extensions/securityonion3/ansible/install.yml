---
# Security Onion 3.2 (Ludus) — manager setup + Elastic Security, then Fleet agents on domain.
# Roles come from ../securityonion/ansible/roles via ansible.cfg roles_path.
- name: Install Security Onion standalone + Elastic Security
  hosts: so_server
  become: true
  vars:
    ludus_so_sniff_tag: 10
    ludus_so_install_type: standalone
    ludus_so_web_user: "onionadmin@ludus.local"
    ludus_so_web_password: "0n10nAdm1n!"
    ludus_so_allow_cidr: >-
      {{ hostvars['so'].ansible_host.split('.')[0:2] | join('.') }}.0.0/16
    ludus_so_range_number_override: "{{ hostvars['so'].ansible_host.split('.')[1] }}"
    ludus_so_agent_allow_cidr: >-
      {{ hostvars['so'].ansible_host.split('.')[0:2] | join('.') }}.0.0/16
  roles:
    - { role: securityonion, tags: ['securityonion', 'so-setup'] }
    - { role: so_elastic_security, tags: ['elastic_security', 'so-elastic'] }

- name: Install Security Onion Elastic Agent on domain hosts
  hosts: so_agents
  vars:
    ludus_so_agent_manager: so
    ludus_so_agent_manager_ip: "{{ hostvars['so'].ansible_host }}"
    ludus_so_agent_allow_cidr: >-
      {{ hostvars['so'].ansible_host.split('.')[0:2] | join('.') }}.0.0/16
    ludus_so_agent_skip_manager: true
  roles:
    - { role: so_elastic_agent, tags: ['elastic_agent', 'so-agent'] }
