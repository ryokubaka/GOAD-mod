  - vm_name: "{{ range_id }}-so"
    hostname: "{{ range_id }}-so"
    template: securityonion-3-x64-template
    vlan: 20
    ip_last_octet: 20
    # so-setup aborts below 16 GiB — keep min=max so Proxmox cannot balloon under floor
    ram_min_gb: 24
    ram_gb: 24
    cpus: 8
    linux: true
    testing:
      snapshot: false
      block_internet: false
