  - vm_name: "{{ range_id }}-so"
    hostname: "{{ range_id }}-so"
    template: securityonion-2.4-x64-template
    vlan: 20
    ip_last_octet: 20
    # so-setup aborts below 16 GiB — keep balloon floor ≥16 so Proxmox cannot reclaim under that
    ram_min_gb: 16
    ram_gb: 20
    cpus: 8
    linux: true
    # Guest agent reports Oracle Linux id "ol". Ludus ships no vars for that group.
    # rhel group_vars are localuser:password, created by the SO template.
    ansible_groups:
      - rhel
    testing:
      snapshot: false
      block_internet: true
