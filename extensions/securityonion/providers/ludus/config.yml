  - vm_name: "{{ range_id }}-so"
    hostname: "{{ range_id }}-so"
    template: securityonion-2.4-x64-template
    vlan: 20
    ip_last_octet: 20
    # balloon: Proxmox min=8 / max=24 — host can reclaim down to 8 GB under pressure
    ram_min_gb: 8
    ram_gb: 24
    cpus: 8
    linux: true
    testing:
      snapshot: false
      block_internet: false
