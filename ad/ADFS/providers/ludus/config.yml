ludus:
  - vm_name: "{{ range_id }}-ADFS-DC01"
    hostname: "{{ range_id }}-DC01"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 10
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-ADFS-ADFS"
    hostname: "{{ range_id }}-ADFS"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 11
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-ADFS-EntraConnect"
    hostname: "{{ range_id }}-EntraConnect"
    template: win2022-server-x64-template
    vlan: 10
    ip_last_octet: 12
    ram_gb: 8
    cpus: 4
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-ADFS-Workstation"
    hostname: "{{ range_id }}-Workstation"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 13
    ram_gb: 4
    cpus: 4
    windows:
      sysprep: true
  - vm_name: "{{ range_id }}-ADFS-gitlab"
    hostname: "{{ range_id }}-gitlab"
