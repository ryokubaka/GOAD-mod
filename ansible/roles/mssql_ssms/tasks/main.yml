- name: create a directory for SSMS installer
  win_file:
    path: c:\setup\mssql
    state: directory

- name: check Microsoft .NET Framework 4.8 installer exists
  win_stat:
    path: c:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe
  register: ssms_dotnet_framework_installer_file

- name: get the .NET Framework 4.8 installer
  win_get_url:
    url: https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe
    dest: c:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe
    checksum: 0a3a390c47e639d0f7fc65b21195fee6b7f65b066f80f70c60fab191d14b7e40
    checksum_algorithm: sha256
  when: not ssms_dotnet_framework_installer_file.stat.exists

- name: Install NDP48-x86-x64-AllOS-ENU.exe runtime silently
  win_package:
    path: c:\setup\mssql\NDP48-x86-x64-AllOS-ENU.exe
    arguments: /quiet /norestart
  when: not ssms_dotnet_framework_installer_file.stat.exists

- name: Reboot after .NET Framework install
  win_reboot:
    reboot_timeout: 600
  when: not ssms_dotnet_framework_installer_file.stat.exists

- name: check SQL Server Management Studio installer exists
  win_stat:
    path: c:\setup\mssql\SSMS_installer.exe
  register: ssms_installer_file

- name: get the SSMS installer
  win_get_url:
    url: https://aka.ms/ssmsfullsetup
    dest: c:\setup\mssql\SSMS_installer.exe
  when: not ssms_installer_file.stat.exists

- name: Check SSMS installation already done
  ansible.windows.win_powershell:
    script: |
      $installed = $false
      foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
        $hit = Get-ChildItem -Path $root -Directory -Filter 'Microsoft SQL Server Management Studio*' -EA 0 |
               ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter 'Ssms.exe' -EA 0 } | Select-Object -First 1
        if ($hit) { $installed = $true; break }
      }
      $installed
  register: ssms_installation

- name: Install SSMS
  ansible.windows.win_command: c:\setup\mssql\SSMS_installer.exe --quiet --norestart --wait
  args:
    chdir: C:\Windows\Temp
  become: true
  become_method: runas
  become_user: SYSTEM
  register: install_ssms
  failed_when: install_ssms.rc not in [0, 3010]
  when: not (ssms_installation.output[0] | default(false) | bool)

- name: Reboot after SSMS install
  win_reboot:
    reboot_timeout: 600
  when: install_ssms is succeeded
