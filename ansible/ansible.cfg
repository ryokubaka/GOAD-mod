[defaults]
host_key_checking     = false
display_skipped_hosts = false
show_per_host_start   = True
deprecation_warning   = false
;stdout_callback         = yaml

[ssh_connection]
# Recycled Ludus IPs: OpenSSH may reject stale ~/.ssh/known_hosts entries even when host_key_checking=false.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o GlobalKnownHostsFile=/dev/null